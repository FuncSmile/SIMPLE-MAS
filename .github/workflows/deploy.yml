name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via Tailscale SSH
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Join Tailscale network ─────────────────────────────────────────
      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # ── 3. Verifikasi koneksi ─────────────────────────────────────────────
      - name: Ping server
        run: ping -c 3 ${{ secrets.DEPLOY_HOST }}

      # ── 4. Deploy ─────────────────────────────────────────────────────────
      # Struktur server:
      #   /home/shosha/SIMPLE-MAS              ← git repo (build context)
      #   /home/shosha/sandbox.id/simple-mas   ← docker-compose.yml + Dockerfile
      #
      # Code di-COPY ke image saat build (COPY . . di Dockerfile),
      # bukan volume mount — jadi harus rebuild image setiap deploy.
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:        ${{ secrets.DEPLOY_HOST }}
          username:    ${{ secrets.DEPLOY_USER }}
          key:         ${{ secrets.DEPLOY_SSH_KEY }}
          port:        22
          script_stop: true
          script: |
            set -e

            echo "══════════════════════════════════════"
            echo "  SIMPEL-MAS DEPLOYMENT"
            echo "  $(date '+%Y-%m-%d %H:%M:%S')"
            echo "══════════════════════════════════════"

            # ── [1/4] Pull kode terbaru ───────────────
            echo "[1/4] Pulling latest code..."
            cd /home/shosha/SIMPLE-MAS
            git pull origin master
            echo "      Done."

            # ── [2/4] Rebuild image PHP-FPM ───────────
            # Build context = /home/shosha/SIMPLE-MAS (COPY . .)
            # Hanya rebuild service 'app', nginx & mysql tidak disentuh
            echo "[2/4] Rebuilding app image..."
            cd /home/shosha/sandbox.id/simple-mas
            docker compose build --no-cache app
            echo "      Done."

            # ── [3/4] Recreate container ──────────────
            # --force-recreate : paksa buat ulang container dengan image baru
            # --no-deps        : jangan restart nginx & mysql
            echo "[3/4] Recreating app container..."
            docker compose up -d --force-recreate --no-deps app

            # Tunggu container running (maks 60 detik)
            echo "      Waiting for container..."
            timeout 60 sh -c '
              until docker compose ps app | grep -q "Up"; do
                sleep 3
              done
            '
            echo "      Container is up."

            # ── [4/4] Migrasi & cache ─────────────────
            # composer install sudah dijalankan saat docker build (RUN composer install di Dockerfile)
            echo "[4/4] Running migrations and clearing CI4 cache..."
            docker compose exec -T app php spark migrate --all --no-interaction
            docker compose exec -T app php spark cache:clear

            echo ""
            echo "══════════════════════════════════════"
            echo "  DEPLOY COMPLETE ✓"
            echo "══════════════════════════════════════"
            docker compose ps
